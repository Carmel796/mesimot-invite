<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>debug</title><style>body{font:15px -apple-system;padding:12px}button,a{display:block;margin:8px 0;padding:12px;font-size:16px;width:100%;text-align:center;border:1px solid #999;border-radius:8px;background:#fff;color:#000;text-decoration:none}#ua{font-size:11px;word-break:break-all;direction:ltr}</style></head>
<body><div id="ua"></div>
<button id="data">1 data</button><button id="blob">2 blob</button>
<a id="static" href="test.ics">3 static</a><a id="webcal">4 webcal</a><button id="dl">5 download-attr</button>
<script>
document.getElementById("ua").textContent=navigator.userAgent+" | standalone="+navigator.standalone;
var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mesimot//HE","BEGIN:VEVENT","UID:dyn-test@mesimot","DTSTAMP:20261024T120000Z","DTSTART:20261025T080000Z","DTEND:20261025T090000Z","SUMMARY:בדיקה דינמית","END:VEVENT","END:VCALENDAR"].join("\r\n");
document.getElementById("data").onclick=function(){location.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics)};
document.getElementById("blob").onclick=function(){location.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}))};
document.getElementById("webcal").href="webcal://"+location.host+location.pathname.replace("debug.html","test.ics");
document.getElementById("dl").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="event.ics";document.body.appendChild(a);a.click()};
</script></body></html>
